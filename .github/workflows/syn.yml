name: Smart Scale Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1-5'  # Mo-Fr 06:00 Uhr deutscher Zeit
    - cron: '0 8 * * 0,6'  # Sa-So 10:00 Uhr deutscher Zeit

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run SmartScaleConnect Sync
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SCALE_APP_EMAIL: ${{ secrets.SCALE_APP_EMAIL }}
          SCALE_APP_PASSWORD: ${{ secrets.SCALE_APP_PASSWORD }}
        run: go run main.go --fitdays --garmin
