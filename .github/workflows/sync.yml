name: Smart Scale Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Config Examples & Code
        run: |
          echo "=== CONFIG EXAMPLES / FILES ==="
          find . -maxdepth 2 -name "*.yml" -o -name "*.yaml" -o -name "*.example*"
          echo "=== CONTENT OF ANY CONFIG EXAMPLE ==="
          cat config.example.yml || cat config.yml.example || true
          echo "=== HELP / USAGE OUTPUT ==="
          go run main.go --help || true
